<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Transação de transferência bancária</title>
  <desc id="d">Transferência de 50 reais da conta A para a conta B. Começa com A 200 e B 100. Se débito e crédito acontecem e a transação é confirmada com COMMIT, fica A 150 e B 150. Se houver falha antes do COMMIT, o ROLLBACK desfaz tudo e volta para A 200 e B 100. Em ambos os casos o total é 300.</desc>
  <defs>
    <marker id="s5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="s5r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="428" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="440" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Transferir R$ 50,00 da conta A para a conta B</text>

  <!-- estado inicial -->
  <rect x="24" y="120" width="140" height="96" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="94" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="#4b5563">ANTES</text>
  <text x="94" y="170" text-anchor="middle" font-size="14" fill="#1f2937">A = 200,00</text>
  <text x="94" y="190" text-anchor="middle" font-size="14" fill="#1f2937">B = 100,00</text>
  <text x="94" y="208" text-anchor="middle" font-size="12" fill="#4b5563">total 300,00</text>

  <!-- transação -->
  <rect x="196" y="66" width="440" height="206" rx="12" fill="#fafbff" stroke="#2f5fa7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="416" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a6e">uma única transação: tudo ou nada</text>

  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13">
    <rect x="214" y="104" width="86" height="40" rx="8" fill="#e8f0fb" stroke="#2f5fa7"/>
    <text x="257" y="129" text-anchor="middle" fill="#1e3a6e" font-weight="700">BEGIN</text>
    <rect x="320" y="104" width="138" height="40" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="389" y="122" text-anchor="middle" fill="#1f2937">débito em A</text>
    <text x="389" y="138" text-anchor="middle" fill="#4b5563" font-size="11.5">A: 200 → 150</text>
    <rect x="478" y="104" width="138" height="40" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="547" y="122" text-anchor="middle" fill="#1f2937">crédito em B</text>
    <text x="547" y="138" text-anchor="middle" fill="#4b5563" font-size="11.5">B: 100 → 150</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.8" marker-end="url(#s5)">
    <line x1="166" y1="168" x2="210" y2="128"/>
    <line x1="302" y1="124" x2="316" y2="124"/>
    <line x1="460" y1="124" x2="474" y2="124"/>
  </g>

  <!-- caminho de sucesso -->
  <rect x="478" y="182" width="138" height="40" rx="8" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="547" y="207" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#1d5634">COMMIT</text>
  <line x1="547" y1="146" x2="547" y2="178" stroke="#2e7d4f" stroke-width="1.8" marker-end="url(#s5)"/>

  <line x1="618" y1="202" x2="690" y2="140" stroke="#2e7d4f" stroke-width="1.8" marker-end="url(#s5)"/>
  <rect x="694" y="92" width="162" height="104" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="775" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#1d5634">✓ CONFIRMADO</text>
  <text x="775" y="142" text-anchor="middle" font-size="14" fill="#1f2937">A = 150,00</text>
  <text x="775" y="162" text-anchor="middle" font-size="14" fill="#1f2937">B = 150,00</text>
  <text x="775" y="184" text-anchor="middle" font-size="12" fill="#4b5563">total 300,00 · durável</text>

  <!-- caminho de falha -->
  <path d="M389,146 v52" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5 4" fill="none"/>
  <text x="389" y="216" text-anchor="middle" font-size="22" fill="#c0392b">⚡</text>
  <text x="389" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b">queda de energia</text>
  <text x="389" y="256" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b">antes do crédito</text>
  <line x1="389" y1="266" x2="389" y2="300" stroke="#c0392b" stroke-width="1.8" marker-end="url(#s5r)"/>

  <rect x="306" y="304" width="166" height="40" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/>
  <text x="389" y="329" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#9b2c22">ROLLBACK</text>
  <line x1="474" y1="324" x2="690" y2="324" stroke="#c0392b" stroke-width="1.8" marker-end="url(#s5r)"/>
  <text x="582" y="314" text-anchor="middle" font-size="12" fill="#9b2c22">recuperação desfaz o débito</text>

  <rect x="694" y="272" width="162" height="104" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/>
  <text x="775" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#9b2c22">↺ DESFEITO</text>
  <text x="775" y="322" text-anchor="middle" font-size="14" fill="#1f2937">A = 200,00</text>
  <text x="775" y="342" text-anchor="middle" font-size="14" fill="#1f2937">B = 100,00</text>
  <text x="775" y="364" text-anchor="middle" font-size="12" fill="#4b5563">nada foi alterado</text>

  <!-- nota -->
  <rect x="24" y="364" width="640" height="46" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <text x="344" y="386" text-anchor="middle" font-size="13" fill="#1f2937"><tspan font-weight="700">Nunca acontece:</tspan> A = 150,00 e B = 100,00 (o dinheiro "sumir").</text>
  <text x="344" y="402" text-anchor="middle" font-size="12" fill="#4b5563">É isso que a atomicidade garante.</text>
</svg>
