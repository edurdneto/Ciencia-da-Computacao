<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Componentes de um sistema de banco de dados</title>
  <desc id="d">Usuários e programadores usam programas de aplicação e consultas, que passam pelo SGBD. O SGBD processa as consultas e acessa o catálogo de metadados e os dados armazenados. O conjunto forma o sistema de banco de dados.</desc>
  <defs>
    <marker id="s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="578" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- limite do sistema -->
  <rect x="24" y="22" width="832" height="536" rx="14" fill="none" stroke="#2f5fa7" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="40" y="10" width="236" height="24" rx="6" fill="#ffffff"/>
  <text x="50" y="28" font-size="15" font-weight="700" fill="#1e3a6e">Sistema de banco de dados</text>

  <!-- usuários -->
  <g fill="#1f2937">
    <g transform="translate(250,52)">
      <circle cx="16" cy="12" r="9" fill="#9ca3af"/><path d="M0,40 q16,-26 32,0 z" fill="#9ca3af"/>
    </g>
    <g transform="translate(300,52)">
      <circle cx="16" cy="12" r="9" fill="#9ca3af"/><path d="M0,40 q16,-26 32,0 z" fill="#9ca3af"/>
    </g>
    <g transform="translate(530,52)">
      <circle cx="16" cy="12" r="9" fill="#9ca3af"/><path d="M0,40 q16,-26 32,0 z" fill="#9ca3af"/>
    </g>
    <g transform="translate(580,52)">
      <circle cx="16" cy="12" r="9" fill="#9ca3af"/><path d="M0,40 q16,-26 32,0 z" fill="#9ca3af"/>
    </g>
  </g>
  <text x="290" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Usuários finais</text>
  <text x="570" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Programadores · analistas</text>

  <!-- aplicações -->
  <rect x="150" y="132" width="280" height="58" rx="10" fill="#e8f0fb" stroke="#2f5fa7" stroke-width="1.5"/>
  <text x="290" y="157" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a6e">Programas de aplicação</text>
  <text x="290" y="177" text-anchor="middle" font-size="12.5" fill="#4b5563">tela do caixa, app, sistema acadêmico</text>
  <rect x="450" y="132" width="280" height="58" rx="10" fill="#e8f0fb" stroke="#2f5fa7" stroke-width="1.5"/>
  <text x="590" y="157" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a6e">Consultas diretas</text>
  <text x="590" y="177" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#4b5563">SELECT … FROM produto …</text>

  <g stroke="#6b7280" stroke-width="2" marker-end="url(#s2)">
    <line x1="290" y1="118" x2="290" y2="128"/>
    <line x1="590" y1="118" x2="590" y2="128"/>
    <line x1="290" y1="192" x2="390" y2="226"/>
    <line x1="590" y1="192" x2="490" y2="226"/>
  </g>

  <!-- SGBD -->
  <rect x="150" y="230" width="580" height="160" rx="12" fill="#fff4dc" stroke="#c98a12" stroke-width="1.8"/>
  <text x="440" y="256" text-anchor="middle" font-size="17" font-weight="700" fill="#7a5208">SGBD — software do sistema</text>
  <rect x="178" y="272" width="524" height="46" rx="8" fill="#ffffff" stroke="#e3b867"/>
  <text x="440" y="292" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Processamento de consultas e programas</text>
  <text x="440" y="310" text-anchor="middle" font-size="12.5" fill="#4b5563">interpreta, verifica permissões, planeja a execução, controla transações</text>
  <rect x="178" y="330" width="524" height="46" rx="8" fill="#ffffff" stroke="#e3b867"/>
  <text x="440" y="350" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Acesso aos dados armazenados</text>
  <text x="440" y="368" text-anchor="middle" font-size="12.5" fill="#4b5563">lê e grava no disco, usa índices, registra log para recuperação</text>

  <g stroke="#6b7280" stroke-width="2" marker-end="url(#s2)" marker-start="url(#s2)">
    <line x1="290" y1="396" x2="290" y2="420"/>
    <line x1="590" y1="396" x2="590" y2="420"/>
  </g>

  <!-- cilindros -->
  <g>
    <path d="M190,440 v80 a100,16 0 0 0 200,0 v-80" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/>
    <ellipse cx="290" cy="440" rx="100" ry="16" fill="#d3ecdc" stroke="#2e7d4f" stroke-width="1.5"/>
    <text x="290" y="480" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1d5634">Catálogo</text>
    <text x="290" y="498" text-anchor="middle" font-size="12.5" fill="#1f2937">metadados: tabelas, colunas,</text>
    <text x="290" y="514" text-anchor="middle" font-size="12.5" fill="#1f2937">tipos, restrições, permissões</text>
  </g>
  <g>
    <path d="M490,440 v80 a100,16 0 0 0 200,0 v-80" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/>
    <ellipse cx="590" cy="440" rx="100" ry="16" fill="#d3ecdc" stroke="#2e7d4f" stroke-width="1.5"/>
    <text x="590" y="480" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1d5634">Banco de dados</text>
    <text x="590" y="498" text-anchor="middle" font-size="12.5" fill="#1f2937">os registros em si:</text>
    <text x="590" y="514" text-anchor="middle" font-size="12.5" fill="#1f2937">produtos, clientes, vendas…</text>
  </g>

  <!-- legenda lateral -->
  <g font-size="12.5" fill="#4b5563">
    <text x="752" y="160">camada de</text>
    <text x="752" y="176">aplicação</text>
    <text x="752" y="306">camada de</text>
    <text x="752" y="322">gerenciamento</text>
    <text x="752" y="474">dados</text>
    <text x="752" y="490">persistidos</text>
  </g>
</svg>
