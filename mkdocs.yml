site_name: Ciência da Computação
site_description: Aulas, vídeos, materiais, códigos e listas de exercícios das disciplinas de Sistemas Operacionais e Fundamentos de Banco de Dados.
site_url: https://edurdneto.github.io/Ciencia-da-Computacao/
repo_url: https://github.com/edurdneto/Ciencia-da-Computacao
repo_name: edurdneto/Ciencia-da-Computacao
edit_uri: edit/main/docs/
copyright: Prof. Dr. Eduardo Rodrigues Duarte Neto · Material didático de Sistemas Operacionais e Fundamentos de Banco de Dados

theme:
  name: material
  language: pt-BR
  icon:
    logo: material/school
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

# Links e âncoras quebrados viram erro no build (--strict)
validation:
  links:
    anchors: warn

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css

nav:
  - Início:
      - index.md
      - Sobre o professor: sobre.md
      - Como usar este site: como-usar.md
  - Sistemas Operacionais:
      - sistemas-operacionais/index.md
      - Cronograma: sistemas-operacionais/cronograma.md
      - Unidades:
          - "Unidade 1 · Introdução": sistemas-operacionais/unidades/unidade-1.md
          - "Unidade 2 · Estruturas do S.O": sistemas-operacionais/unidades/unidade-2.md
          - "Unidade 3 · Processos": sistemas-operacionais/unidades/unidade-3.md
          - "Unidade 4 · Threads": sistemas-operacionais/unidades/unidade-4.md
          - "Unidade 5 · Sincronização": sistemas-operacionais/unidades/unidade-5.md
          - "Unidade 6 · Scheduling da CPU": sistemas-operacionais/unidades/unidade-6.md
      - Listas de exercícios:
          - "Lista 01 · Processos": sistemas-operacionais/listas/lista-01.md
      - Materiais: sistemas-operacionais/materiais.md
  - Banco de Dados:
      - banco-de-dados/index.md
      - Cronograma: banco-de-dados/cronograma.md
      - Aulas:
          - "Aula 01 · Apresentação e ambiente": banco-de-dados/aulas/01-introducao.md
          - "Aula 02 · Fundamentos de BD e SGBDs": banco-de-dados/aulas/02-fundamentos-sgbd.md
          - "Aula 10 · SQL: consultas básicas": banco-de-dados/aulas/10-sql-consultas.md
      - Listas de exercícios:
          - "Lista 03 · SQL básico": banco-de-dados/listas/lista-03.md
      - Materiais: banco-de-dados/materiais.md
